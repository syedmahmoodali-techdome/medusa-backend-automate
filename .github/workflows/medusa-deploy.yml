name: Medusa Backend Deploy (clone source repo, build, deploy via Terraform)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      ###########################################################################
      # 1) CHECKOUT THIS PIPELINE REPO
      ###########################################################################
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      ###########################################################################
      # 2) CLONE SOURCE MEDUSA BACKEND REPO (runner only)
      ###########################################################################
      - name: Clone Medusa backend source repo
        uses: actions/checkout@v4
        with:
          repository: smarter-EMR/ecomm-terraform
          path: ecomm-terraform
          token: ${{ secrets.GH_PAT }}

      ###########################################################################
      # 3) ENSURE config JSON exists
      ###########################################################################
      - name: Validate medusa-deploy-config.json
        run: |
          if [ ! -f medusa-deploy-config.json ]; then
            echo "❌ medusa-deploy-config.json missing!"
            exit 1
          fi
          echo "medusa-deploy-config.json found:"
          cat medusa-deploy-config.json

      ###########################################################################
      # 4) CREATE DOCKERFILE inside source repo (runner only)
      ###########################################################################
      - name: Create Dockerfile in Medusa source
        run: |
          SRC=ecomm-terraform/my-medusa-store
          cat > $SRC/Dockerfile <<'EOF'
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY package.json yarn.lock* package-lock.json* ./
          RUN npm ci --production=false
          COPY . .
          RUN npm run build || true

          FROM node:20-alpine
          WORKDIR /app
          ENV NODE_ENV=production
          COPY --from=builder /app .
          EXPOSE 9000
          CMD ["yarn", "start"]
          EOF

      ###########################################################################
      # 5) Parse JSON -> ENV vars
      ###########################################################################
      - name: Parse JSON into ENV vars
        run: |
          echo "IMAGE_REPO=$(jq -r .image_repo_name medusa-deploy-config.json)" >> $GITHUB_ENV
          echo "IMAGE_TAG=$(jq -r .image_tag medusa-deploy-config.json)" >> $GITHUB_ENV
          echo "ACR_NAME=$(jq -r .acr_name medusa-deploy-config.json)" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=$(jq -r .resource_group medusa-deploy-config.json)" >> $GITHUB_ENV


      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.5


      ###########################################################################
      # 6) AZURE LOGIN
      ###########################################################################
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      ###########################################################################
      # 7) TERRAFORM INIT + ACR CREATION ONLY
      ###########################################################################
      - name: Terraform Init + Apply (ACR only)
        run: |
          terraform init -input=false
          terraform apply -auto-approve -target=module.acr

      ###########################################################################
      # 8) BUILD & PUSH IMAGE TO ACR
      ###########################################################################
      - name: Build & Push Medusa Docker image
        run: |
          SRC=ecomm-terraform/my-medusa-store

          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          echo "ACR login server: $LOGIN_SERVER"

          IMAGE="$LOGIN_SERVER/$IMAGE_REPO:$IMAGE_TAG"

          docker build -t "$IMAGE" "$SRC" --file "$SRC/Dockerfile"
          az acr login --name "$ACR_NAME"
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      ###########################################################################
      # 9) COPY CONFIG JSON AS TERRAFORM VARS
      ###########################################################################
      - name: Prepare terraform.tfvars.json
        run: |
          cp medusa-deploy-config.json terraform.tfvars.json

      ###########################################################################
      # 10) FULL TERRAFORM APPLY (DB+APP_SERVICE)
      ###########################################################################
      - name: Terraform Init + Apply Full Infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -var-file="terraform.tfvars.json"

      ###########################################################################
      # 11) EXPORT OUTPUTS
      ###########################################################################
      - name: Terraform Outputs
        run: |
          terraform output -json > tf_outputs.json
          cat tf_outputs.json

      ###########################################################################
      # 12) DELETE ACR (as requested)
      ###########################################################################
      - name: Delete ACR
        if: always()
        run: |
          echo "Deleting ACR: $ACR_NAME"
          az acr delete -n "$ACR_NAME" --yes || true
